plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '0.10.4' 
}

group = 'com.mygym.app'
version = '0.0.1-SNAPSHOT'
description = 'mga-people-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25) 
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.2"
    }
}

dependencies {
    // Base Shared Dependencies
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
    implementation 'io.github.resilience4j:resilience4j-bulkhead'
    
    // 🎯 REPLACED STRATEGY: Official Spring Security Resource Server (Precompiled GraalVM Native Hints Built-in)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    
    // Custom Repository Model Match
    implementation 'com.github.mga-code-base:mga-all-models-jars:release-v1.1-SNAPSHOT'
    
    // GraalVM SDK mapped from <scope>provided</scope>
    compileOnly 'org.graalvm.sdk:graal-sdk:24.1.1'
    
    // Conditional Profiles Isolation
    if (!project.gradle.startParameter.taskNames.any { it.contains("native") || it.contains("bootBuildImage") }) {
        implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    }

    // Test Scaffolding
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-stub-runner'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootJar {
    mainClass = 'com.mygym.app.MgaPeopleServiceApplication'
}

// 🚀 CLEANED UP NATIVE CONFIGURATION Matrix
tasks.named('bootBuildImage') {
    builder = 'paketobuildpacks/builder-jammy-java-tiny'
    pullPolicy = 'ALWAYS'
    environment = [
        'BP_NATIVE_IMAGE'                  : 'true',
        'BP_JVM_VERSION'                   : '25',
        'BPE_APPEND_SPRING_PROFILES_ACTIVE': 'native',
        'BPE_APPEND_ACTIVATEDENV'          : 'PRD', 
        'BP_NATIVE_IMAGE_BUILD_ARGUMENTS'  : 
            '--initialize-at-run-time=sun.security.util.Password$ConsoleHolder ' +
            '--initialize-at-build-time=com.fasterxml.jackson' 
    ]
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Aspring.profiles.active=native"
    options.compilerArgs << "-AactivatedEnv=PRD"
}

tasks.named('processAot') {
    args '--spring.profiles.active=native', '--activatedEnv=PRD'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'contract'
    }
}

tasks.register('consumerContractTest', Test) {
    description = 'Verifies this service against the published people-crud stubs'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'contract'
    }
}
